<script>

const toggle = document.getElementById('theme-toggle');
const body = document.body;

// Appliquer le thème au chargement
const currentTheme = localStorage.getItem('theme') || 'default';
body.setAttribute('data-md-color-scheme', currentTheme);

toggle.addEventListener('click', () => {
    let scheme = body.getAttribute('data-md-color-scheme');
    let newScheme = (scheme === 'default') ? 'slate' : 'default';
    
    body.setAttribute('data-md-color-scheme', newScheme);
    localStorage.setItem('theme', newScheme);
});

// 4. CONVERSION TIKZ POUR TIKZJAX
    document.querySelectorAll('pre').forEach(pre => {
        let code = pre.querySelector('code');
        if (code && code.textContent.includes('\\begin{tikzpicture}')) {
            let script = document.createElement('script');
            script.type = 'text/tikz';
            // On force le chargement des librairies nécessaires pour vos matrices
            script.innerHTML = '\\usetikzlibrary{matrix, calc}\n' + code.textContent;
            pre.replaceWith(script);
        }
    });

document.addEventListener("DOMContentLoaded", function() {

    let secCount = -1;
    let thmCount = -1;
    let labels = {};

    const noms = {
        'wthm':'Théorème', 'wprop':'Proposition', 'wdefi':'Définition',
        'wlem':'Lemme', 'wcor':'Corollaire', 'wappli':'Application',
        'wrem':'Remarque', 'wrappel': 'Rappel', 'wex':'Exemple',
        'wexs':'Exemples', 'wproof':'Preuve'
    };

    // Numérotation des environnements
    document.querySelectorAll("h1, .wthm, .wprop, .wdefi, .wlem, .wcor, .wappli, .wrem, .wex,.wexs, .wrappel,.wproof").forEach(el => {
        if (el.tagName.toLowerCase() === "h1" && !el.closest("#TOC")) {
            secCount++;
            thmCount = 0;
        } else if (noms[Array.from(el.classList).find(c => noms[c])]) {
            let type = Array.from(el.classList).find(c => noms[c]);
            if (type !== 'wproof') {
                thmCount++;
                let num = secCount + "." + thmCount;
                let id = el.querySelector("span[id]") ? el.querySelector("span[id]").id : null;
                if(id) labels[id] = { num: num, type: type.substring(1) };
                
                let p = el.querySelector("p");
                if (p) {
                    let strong = p.querySelector("strong");
                    let title = (strong && strong.innerText.includes("(")) ? ` <span class="env-title">${strong.outerHTML}</span>` : "";
                    if (title) strong.remove();
                    p.innerHTML = `<strong class="env-header">${noms[type]} ${num}</strong>` + title + " — " + p.innerHTML;
                }
            } else {
                let p = el.querySelector("p");
                if (p) p.innerHTML = `<strong class="env-header">Preuve</strong> — ` + p.innerHTML;
            }
        }
    });

    // Fonction lancée une fois MathJax terminé
    function executerApresMathJax() {
        
        // 1. Capture des équations
        document.querySelectorAll("mjx-math[display='true']").forEach((el, index) => {
            let num = el.querySelector(".mjx-eqn-number");
            if (num) {
                let val = num.innerText.replace(/[()]/g, '');
                let id = el.id || "eq-" + index;
                el.id = id;
                labels[id] = { num: val, type: 'eq' };
            }
        });

        // 2. TRACÉ DES LIGNES PARTIELLES
        document.querySelectorAll("mjx-mtext").forEach(el => {
            let text = el.textContent;
            
            // DÉCODAGE MAGIQUE : si MathJax cache le texte dans les classes CSS
            if (!text || text.trim() === "") {
                text = Array.from(el.children).map(c => {
                    let cls = Array.from(c.classList).find(className => className.startsWith('mjx-c'));
                    return cls ? String.fromCharCode(parseInt(cls.replace('mjx-c', ''), 16)) : '';
                }).join('');
            }

            // Remplacement des \ref{type:id} à l'intérieur de \text{} en mode math
            const refRegex = /\\ref\{(prop|thm|def|cor|lem|appli|rem|rappel|ex|exs):(.*?)\}/g;

            if (refRegex.test(text)) {
                const nouveauTexte = text.replace(refRegex, (m, t, id) => {
                    const f = t + ":" + id;
                    return labels[f] ? labels[f].num : m;
                });

                if (nouveauTexte !== text) {
                    el.textContent = nouveauTexte;
                }
            }

            if (text.includes("CLINEX")) {
                let regex = /CLINEX(\d+)X(\d+)X/g;
                let match;
                let row = el.closest("mjx-mtr");
                let prevRow = row ? row.previousElementSibling : null;

                while ((match = regex.exec(text)) !== null) {
                    let start = parseInt(match[1]);
                    let end = parseInt(match[2]);

                    if (prevRow) {
                        let cells = prevRow.querySelectorAll("mjx-mtd");
                        for (let i = start - 1; i < end; i++) {
                            if (cells[i]) {
                                cells[i].style.borderBottom = "max(1px, 0.08em) solid currentColor";
                                cells[i].style.paddingBottom = "0.2em";
                            }
                        }
                    }
                }
                // On fait disparaître le marqueur texte
                el.style.display = "none";
            }
        });

       // 3. Remplacement des références
        document.querySelectorAll("body *").forEach(el => {
            if (el.childNodes.length === 1 && el.childNodes[0].nodeType === Node.TEXT_NODE) {
                el.innerHTML = el.innerHTML
                // Remplace les \eqref{...}
                .replace(/\\eqref\{(.*?)\}/g, (m, id) => labels[id] ? `<a href="#${id}">(${labels[id].num})</a>` : m)
                // NOUVEAU : Remplace les \ref{...} classiques (souvent utilisés dans les \text{} de MathJax)
                .replace(/\\ref\{(prop|thm|def|cor|lem|appli|rem|rappel|ex|exs):(.*?)\}/g, (m, t, id) => {
                    let f = t + ":" + id;
                    return labels[f] ? `<a href="#${f}" class="ref-${t}">${labels[f].num}</a>` : m;
                })
                // Remplace ta syntaxe personnalisée entre crochets [...]
                .replace(/\[(prop|thm|def|cor|lem|appli|rem|rappel|ex|exs):(.*?)\]/g, (m, t, id) => {
                    let f = t + ":" + id;
                    return labels[f] ? `<a href="#${f}" class="ref-${t}">${labels[f].num}</a>` : m;
                });
            }
        });

        // 3. Remplacement des références 
        document.querySelectorAll("body *").forEach(el => { 
            if (el.childNodes.length === 1 && el.childNodes[0].nodeType === Node.TEXT_NODE) {
                 el.innerHTML = el.innerHTML 
                 .replace(/\\eqref\{(.*?)\}/g, (m, id) => labels[id] ? `<a href="#${id}">(${labels[id].num})</a>` : m) 
                 .replace(/\[(prop|thm|def|cor|lem|appli|rem|rappel|ex|exs):(.*?)\]/g, (m, t, id) => { 
                    let f = t + ":" + id; 
                    return labels[f] ? `<a href="#${f}" class="ref-${t}">${labels[f].num}</a>` : m; }); } }); } 

    // Attente robuste de MathJax
    function waitForMathJax() {
        if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
            window.MathJax.startup.promise.then(() => {
                setTimeout(executerApresMathJax, 50); 
            }).catch(err => console.log('Erreur MathJax', err));
        } else {
            setTimeout(waitForMathJax, 100);
        }
    }

    waitForMathJax();

});
</script>
